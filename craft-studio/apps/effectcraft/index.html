<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EffectCraft — Motion Graphics, Particles & Lottie Studio</title>
  <link rel="icon" href="../../assets/icons/effectcraft.png">
  <link rel="stylesheet" href="../../assets/studio-common.css">
  <style>
    :root { --accent: #e0368f; }
    .fx-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 290px; }
    .fx-stage { display: grid; place-items: center; background: #090b10; padding: 16px; }
    #compCanvas { width: min(860px, 100%); aspect-ratio: 16 / 9; background: #07090e; border-radius: 8px; border: 1px solid var(--ui-line-2); }
    .fx-side { background: var(--ui-panel); border-left: 1px solid var(--ui-line); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    @media (max-width: 820px) { .fx-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="ws-app">
  <div class="ws-menubar">
    <span class="ws-logo"><img src="../../assets/icons/effectcraft.png" alt=""> EffectCraft <small style="opacity:.6">MOTION VFX</small></span>
    <button class="ws-btn active" id="togglePlay">⏸ Pause</button>
    <button class="ws-btn primary" id="exportLottieBtn">💾 Export Lottie .JSON</button>
    <button class="ws-btn" id="recordFxBtn">🎬 Export .WebM</button>
    <span class="ws-sep"></span>
    <label>Hero Headline <input id="fxTitle" class="ws-input" value="KINETIC MOTION" style="width:190px"></label>
    <input type="color" id="fxPrimary" value="#ec4899" title="Primary Glow">
    <input type="color" id="fxSecondary" value="#38bdf8" title="Secondary Glow">
  </div>

  <div class="fx-body">
    <main class="fx-stage"><canvas id="compCanvas" width="960" height="540"></canvas></main>
    <aside class="fx-side">
      <strong style="font-size:12px">Keyframe Speed Curve & Emitter</strong>
      <canvas id="curveGraph" width="260" height="100" style="width:100%;background:#0c0f17;border-radius:7px;border:1px solid var(--ui-line)"></canvas>
      <label>Particle Count (<span id="pCountLbl">90</span>) <input type="range" id="pCount" min="10" max="260" value="90" style="width:100%"></label>
      <label>Motion Speed <input type="range" id="mSpeed" min="20" max="250" value="100" style="width:100%"></label>
      <label>Wiggle Amplitude <input type="range" id="mWiggle" min="0" max="60" value="16" style="width:100%"></label>
      <label>3D Orbit Depth <input type="range" id="mDepth" min="10" max="150" value="75" style="width:100%"></label>
    </aside>
  </div>

  <div class="ws-status">
    <span id="fxStatus">60 fps real-time particle & kinetic typography compositor running</span>
    <span class="mono" id="frameLbl">Frame 000</span>
  </div>
</div>

<script type="module">
  const cv = document.getElementById("compCanvas");
  const ctx = cv.getContext("2d");
  let running = true, frame = 0;
  const particles = Array.from({ length: 260 }, () => ({
    a: Math.random() * Math.PI * 2, r: 60 + Math.random() * 340, s: 0.4 + Math.random() * 2.2, z: Math.random()
  }));

  function drawGraph(t) {
    const gc = document.getElementById("curveGraph");
    const g = gc.getContext("2d");
    g.clearRect(0, 0, gc.width, gc.height);
    g.strokeStyle = "#ec4899"; g.lineWidth = 2.2; g.beginPath();
    g.moveTo(12, 88); g.bezierCurveTo(75, 86, 145, 14, 248, 12); g.stroke();
    const px = 12 + ((t % 1) * 236);
    g.fillStyle = "#38bdf8"; g.beginPath(); g.arc(px, 88 - Math.pow(t % 1, 2) * 76, 4.5, 0, Math.PI * 2); g.fill();
  }

  function tick() {
    if (running) {
      frame++;
      const spd = Number(document.getElementById("mSpeed").value) / 100;
      const wig = Number(document.getElementById("mWiggle").value);
      const depth = Number(document.getElementById("mDepth").value);
      const count = Number(document.getElementById("pCount").value);
      document.getElementById("pCountLbl").textContent = count;
      const c1 = document.getElementById("fxPrimary").value, c2 = document.getElementById("fxSecondary").value;
      const t = (frame * 0.018) * spd;

      ctx.fillStyle = "rgba(7, 9, 14, 0.34)";
      ctx.fillRect(0, 0, 960, 540);

      for (let i = 0; i < count; i++) {
        const p = particles[i];
        const ang = p.a + t * p.s * 0.5;
        const x = 480 + Math.cos(ang) * p.r;
        const y = 270 + Math.sin(ang * 1.3) * (p.r * (depth / 150));
        ctx.fillStyle = i % 2 ? c1 : c2;
        ctx.beginPath(); ctx.arc(x, y, 1.5 + p.z * 3.5, 0, Math.PI * 2); ctx.fill();
      }

      const wy = Math.sin(t * 2.4) * wig;
      ctx.save();
      ctx.translate(480, 270 + wy);
      ctx.scale(1 + Math.sin(t * 1.5) * 0.05, 1 + Math.sin(t * 1.5) * 0.05);
      ctx.shadowColor = c1; ctx.shadowBlur = 28;
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 58px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(document.getElementById("fxTitle").value, 0, 16);
      ctx.restore();

      document.getElementById("frameLbl").textContent = `Frame ${String(frame).padStart(4, "0")}`;
      drawGraph(t * 0.35);
    }
    requestAnimationFrame(tick);
  }

  document.getElementById("togglePlay").onclick = (e) => {
    running = !running;
    e.currentTarget.textContent = running ? "⏸ Pause" : "▶ Play";
  };
  document.getElementById("exportLottieBtn").onclick = () => {
    const lottie = {
      v: "5.9.0", fr: 60, ip: 0, op: 180, w: 960, h: 540, nm: document.getElementById("fxTitle").value,
      layers: [{ ty: 4, nm: "Pulse Ring", ks: { p: { a: 0, k: [480, 270, 0] }, s: { a: 1, k: [{ t: 0, s: [90, 90, 100] }, { t: 90, s: [115, 115, 100] }, { t: 180, s: [90, 90, 100] }] } } }]
    };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(lottie, null, 2)], { type: "application/json" }));
    a.download = "effectcraft-animation.json";
    a.click();
  };
  document.getElementById("recordFxBtn").onclick = () => {
    const rec = new MediaRecorder(cv.captureStream(30), { mimeType: "video/webm" });
    const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
      a.download = "effectcraft-vfx.webm";
      a.click();
    };
    rec.start();
    document.getElementById("fxStatus").textContent = "Recording 3s 60fps loop to .WebM…";
    setTimeout(() => { rec.stop(); document.getElementById("fxStatus").textContent = "Saved effectcraft-vfx.webm!"; }, 3000);
  };
  tick();
</script>
</body>
</html>
