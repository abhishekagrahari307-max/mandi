<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CADCraft — 2D Technical CAD & AutoCAD DXF Studio</title>
  <link rel="icon" href="../../assets/icons/cadcraft.png">
  <link rel="stylesheet" href="../../assets/studio-common.css">
  <style>
    :root { --accent: #3ea6e8; }
    .cad-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 48px 1fr 225px; }
    .cad-rail { background: var(--ui-panel); border-right: 1px solid var(--ui-line); display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; }
    .c-tool { width: 34px; height: 32px; border-radius: 6px; border: 0; background: transparent; color: #94a3b8; cursor: pointer; }
    .c-tool.active { background: #3ea6e8; color: #fff; }
    #cadCanvas { width: 100%; height: 100%; display: block; background: #08111d; cursor: crosshair; touch-action: none; }
    .cad-layers { background: var(--ui-panel); border-left: 1px solid var(--ui-line); padding: 12px; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
    .cmd-bar { height: 34px; background: #0c121d; border-top: 1px solid var(--ui-line); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
    @media (max-width: 820px) { .cad-body { grid-template-columns: 44px 1fr; } .cad-layers { display: none; } }
  </style>
</head>
<body>
<div class="ws-app">
  <div class="ws-menubar">
    <span class="ws-logo"><img src="../../assets/icons/cadcraft.png" alt=""> CADCraft <small style="opacity:.6">DXF CAD</small></span>
    <label class="ws-btn">📂 Open .DXF <input id="openDxf" type="file" accept=".dxf" hidden></label>
    <button class="ws-btn primary" id="saveDxfBtn">💾 Export AutoCAD .DXF</button>
    <button class="ws-btn" id="savePngBtn">⬇ Blueprint .PNG</button>
    <span class="ws-sep"></span>
    <button class="ws-btn active" id="snapBtn">⊞ Grid Snap (20mm)</button>
    <button class="ws-btn" id="orthoBtn">∟ Ortho F8</button>
    <button class="ws-btn" id="undoCadBtn">↶ Undo</button>
    <button class="ws-btn" id="clearCadBtn">🗑 Clear</button>
  </div>

  <div class="cad-body">
    <div class="cad-rail" id="cadTools">
      <button class="c-tool active" data-t="line" title="LINE (L)">╱</button>
      <button class="c-tool" data-t="rect" title="RECTANGLE (REC)">▭</button>
      <button class="c-tool" data-t="circle" title="CIRCLE (C)">◯</button>
      <button class="c-tool" data-t="dim" title="DIMENSION (DIM)">↔</button>
    </div>
    <div style="position:relative;min-height:0"><canvas id="cadCanvas"></canvas></div>
    <aside class="cad-layers" id="layerBox"></aside>
  </div>

  <div class="cmd-bar">
    <span class="mono" style="color:#38bdf8;font-weight:700">COMMAND:</span>
    <input id="cmdInput" class="ws-input mono" style="flex:1" placeholder="Type LINE, RECT, CIRCLE, DIM, UNDO — or draw on blueprint grid">
  </div>

  <div class="ws-status">
    <span id="cadStatus">Architectural floorplan loaded — draw new walls/dimensions or export real AutoCAD R12 .DXF</span>
    <span class="mono" id="cadCoords">X: 0.00 · Y: 0.00 mm</span>
  </div>
</div>

<script type="module">
  const cv = document.getElementById("cadCanvas");
  const ctx = cv.getContext("2d");
  const LAYERS = [
    { name: "WALLS", color: "#38bdf8", vis: true },
    { name: "FIXTURES", color: "#4ade80", vis: true },
    { name: "DIMENSIONS", color: "#facc15", vis: true },
    { name: "CENTERLINES", color: "#f472b6", vis: true }
  ];
  let activeLayer = 0, tool = "line", snap = true, ortho = false;
  let entities = [
    { type: "rect", x1: 120, y1: 80, x2: 720, y2: 440, layer: "WALLS" },
    { type: "line", x1: 420, y1: 80, x2: 420, y2: 300, layer: "WALLS" },
    { type: "line", x1: 120, y1: 280, x2: 340, y2: 280, layer: "WALLS" },
    { type: "circle", x1: 570, y1: 200, r: 52, layer: "FIXTURES" },
    { type: "rect", x1: 160, y1: 120, x2: 300, y2: 220, layer: "FIXTURES" },
    { type: "dim", x1: 120, y1: 56, x2: 720, y2: 56, layer: "DIMENSIONS" },
    { type: "dim", x1: 748, y1: 80, x2: 748, y2: 440, layer: "DIMENSIONS" }
  ];
  let startPt = null, curPt = null;

  function resize() {
    cv.width = cv.parentElement.clientWidth || 860;
    cv.height = cv.parentElement.clientHeight || 520;
    draw();
  }
  window.addEventListener("resize", resize);

  const layerColor = (name) => LAYERS.find((l) => l.name === name)?.color || "#ffffff";
  const layerVis = (name) => LAYERS.find((l) => l.name === name)?.vis !== false;

  function drawEntity(e) {
    if (!layerVis(e.layer)) return;
    ctx.strokeStyle = layerColor(e.layer);
    ctx.fillStyle = layerColor(e.layer);
    ctx.lineWidth = e.layer === "WALLS" ? 2.2 : 1.3;
    if (e.type === "line") {
      ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
    } else if (e.type === "rect") {
      ctx.strokeRect(e.x1, e.y1, e.x2 - e.x1, e.y2 - e.y1);
    } else if (e.type === "circle") {
      ctx.beginPath(); ctx.arc(e.x1, e.y1, e.r, 0, Math.PI * 2); ctx.stroke();
    } else if (e.type === "dim") {
      ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
      const dist = Math.round(Math.hypot(e.x2 - e.x1, e.y2 - e.y1) * 10);
      ctx.font = "11px monospace";
      ctx.fillText(`${dist} mm`, (e.x1 + e.x2) / 2 - 22, (e.y1 + e.y2) / 2 - 6);
    }
  }

  function draw() {
    ctx.fillStyle = "#07101c";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = "rgba(56, 189, 248, 0.08)";
    ctx.lineWidth = 1;
    for (let x = 0; x < cv.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
    for (let y = 0; y < cv.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }
    entities.forEach(drawEntity);
    if (startPt && curPt) {
      drawEntity({
        type: tool, x1: startPt.x, y1: startPt.y, x2: curPt.x, y2: curPt.y,
        r: Math.hypot(curPt.x - startPt.x, curPt.y - startPt.y), layer: LAYERS[activeLayer].name
      });
    }
  }

  function renderLayers() {
    document.getElementById("layerBox").innerHTML =
      `<strong style="font-size:12px">CAD Layers</strong>` +
      LAYERS.map((l, i) => `
        <div class="ws-btn ${i === activeLayer ? "active" : ""}" data-l="${i}" style="justify-content:space-between">
          <span style="color:${l.color}">● ${l.name}</span>
          <span data-vis="${i}">${l.vis ? "👁" : "—"}</span>
        </div>`).join("");
  }

  function getPt(ev) {
    const r = cv.getBoundingClientRect();
    let x = ev.clientX - r.left, y = ev.clientY - r.top;
    if (snap) { x = Math.round(x / 20) * 20; y = Math.round(y / 20) * 20; }
    if (ortho && startPt) {
      if (Math.abs(x - startPt.x) > Math.abs(y - startPt.y)) y = startPt.y; else x = startPt.x;
    }
    return { x, y };
  }

  cv.addEventListener("pointerdown", (e) => { startPt = curPt = getPt(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => {
    const p = getPt(e);
    document.getElementById("cadCoords").textContent = `X: ${(p.x * 10).toFixed(0)} · Y: ${(p.y * 10).toFixed(0)} mm`;
    if (startPt) { curPt = p; draw(); }
  });
  cv.addEventListener("pointerup", () => {
    if (!startPt || !curPt) return;
    entities.push({
      type: tool, x1: startPt.x, y1: startPt.y, x2: curPt.x, y2: curPt.y,
      r: Math.hypot(curPt.x - startPt.x, curPt.y - startPt.y), layer: LAYERS[activeLayer].name
    });
    startPt = curPt = null;
    draw();
  });

  document.getElementById("cadTools").onclick = (e) => {
    const b = e.target.closest("[data-t]");
    if (!b) return;
    tool = b.dataset.t;
    document.querySelectorAll(".c-tool").forEach((el) => el.classList.toggle("active", el === b));
  };
  document.getElementById("layerBox").onclick = (e) => {
    if (e.target.dataset.vis !== undefined) {
      e.stopPropagation();
      const i = Number(e.target.dataset.vis);
      LAYERS[i].vis = !LAYERS[i].vis;
      renderLayers(); draw(); return;
    }
    const row = e.target.closest("[data-l]");
    if (row) { activeLayer = Number(row.dataset.l); renderLayers(); }
  };
  document.getElementById("snapBtn").onclick = (e) => { snap = !snap; e.currentTarget.classList.toggle("active", snap); };
  document.getElementById("orthoBtn").onclick = (e) => { ortho = !ortho; e.currentTarget.classList.toggle("active", ortho); };
  document.getElementById("undoCadBtn").onclick = () => { entities.pop(); draw(); };
  document.getElementById("clearCadBtn").onclick = () => { entities = []; draw(); };

  document.getElementById("cmdInput").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const v = e.target.value.trim().toUpperCase();
    if (v === "LINE" || v === "L") tool = "line";
    else if (v === "RECT" || v === "REC") tool = "rect";
    else if (v === "CIRCLE" || v === "C") tool = "circle";
    else if (v === "DIM") tool = "dim";
    else if (v === "UNDO") { entities.pop(); draw(); }
    document.querySelectorAll(".c-tool").forEach((el) => el.classList.toggle("active", el.dataset.t === tool));
    e.target.value = "";
  });

  // Real AutoCAD R12 .DXF Writer & Reader
  document.getElementById("saveDxfBtn").onclick = () => {
    let dxf = "0\nSECTION\n2\nENTITIES\n";
    entities.forEach((e) => {
      if (e.type === "line" || e.type === "dim") {
        dxf += `0\nLINE\n8\n${e.layer}\n10\n${e.x1}\n20\n${e.y1}\n30\n0.0\n11\n${e.x2}\n21\n${e.y2}\n31\n0.0\n`;
      } else if (e.type === "rect") {
        const pts = [[e.x1,e.y1,e.x2,e.y1],[e.x2,e.y1,e.x2,e.y2],[e.x2,e.y2,e.x1,e.y2],[e.x1,e.y2,e.x1,e.y1]];
        pts.forEach(([a,b,c,d]) => { dxf += `0\nLINE\n8\n${e.layer}\n10\n${a}\n20\n${b}\n30\n0.0\n11\n${c}\n21\n${d}\n31\n0.0\n`; });
      } else if (e.type === "circle") {
        dxf += `0\nCIRCLE\n8\n${e.layer}\n10\n${e.x1}\n20\n${e.y1}\n30\n0.0\n40\n${e.r.toFixed(2)}\n`;
      }
    });
    dxf += "0\nENDSEC\n0\nEOF\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([dxf], { type: "application/dxf" }));
    a.download = "cadcraft-drawing.dxf";
    a.click();
    document.getElementById("cadStatus").textContent = `Exported AutoCAD R12 DXF (${entities.length} entities)`;
  };

  document.getElementById("openDxf").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const lines = (await f.text()).split(/\r?\n/).map((s) => s.trim());
    const parsed = [];
    for (let i = 0; i < lines.length; i++) {
      if (lines[i] === "LINE") {
        const map = {};
        for (let j = i + 1; j < Math.min(lines.length, i + 20) && lines[j] !== "0"; j += 2) map[lines[j]] = Number(lines[j + 1]);
        if (!Number.isNaN(map["10"])) parsed.push({ type: "line", x1: map["10"], y1: map["20"], x2: map["11"], y2: map["21"], layer: "WALLS" });
      }
    }
    if (parsed.length) { entities = parsed; draw(); document.getElementById("cadStatus").textContent = `Imported ${parsed.length} DXF entities from ${f.name}`; }
  };

  document.getElementById("savePngBtn").onclick = () => {
    const a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "cadcraft-blueprint.png";
    a.click();
  };

  renderLayers();
  requestAnimationFrame(resize);
</script>
</body>
</html>
