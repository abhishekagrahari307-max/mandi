<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PdfCraft — PDF Reader, Merger, Organizer & Signer</title>
  <link rel="icon" href="../../assets/icons/pdfcraft.png">
  <link rel="stylesheet" href="../../assets/studio-common.css">
  <style>
    :root { --accent: #12a58a; }
    .pdf-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 215px 1fr; }
    .pdf-thumbs {
      background: var(--ui-panel); border-right: 1px solid var(--ui-line);
      overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px;
    }
    .thumb-card {
      padding: 7px; border-radius: 8px; background: #121620; border: 1px solid var(--ui-line);
      cursor: pointer; text-align: center;
    }
    .thumb-card.active { border-color: #12a58a; background: rgba(18, 165, 138, 0.16); }
    .thumb-card canvas { max-width: 100%; height: auto; border-radius: 4px; background: #fff; }
    .pdf-stage {
      overflow: auto; padding: 22px; background: #0f1219; display: flex; justify-content: center; align-items: flex-start;
    }
    .page-holder { position: relative; box-shadow: 0 20px 55px rgba(0,0,0,0.6); background: #fff; }
    #pdfCanvas { display: block; }
    #inkOverlay { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
    .organize-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 14px; width: 100%; max-width: 1100px;
    }
    .org-item {
      background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    .org-item canvas { max-width: 100%; border-radius: 4px; background: #fff; }
    @media (max-width: 820px) { .pdf-body { grid-template-columns: 1fr; } .pdf-thumbs { display: none; } }
  </style>
</head>
<body>
<div class="ws-app">
  <div class="ws-menubar">
    <span class="ws-logo"><img src="../../assets/icons/pdfcraft.png" alt=""> PdfCraft <small style="opacity:.6">PDF</small></span>
    <label class="ws-btn">📂 Open .PDF <input id="openPdf" type="file" accept="application/pdf" hidden></label>
    <label class="ws-btn">➕ Merge PDF / Image <input id="mergeInput" type="file" accept="application/pdf,image/png,image/jpeg" multiple hidden></label>
    <button class="ws-btn primary" id="downloadPdfBtn">💾 Save .PDF</button>
    <span class="ws-sep"></span>
    <button class="ws-btn active" id="modeReadBtn">📖 Read & Sign</button>
    <button class="ws-btn" id="modeOrgBtn">🗂 Organize Pages</button>
    <span class="ws-sep"></span>
    <button class="ws-btn" id="addTextStampBtn">𝐓 Add Text</button>
    <button class="ws-btn" id="signToggleBtn">✍ Draw Signature</button>
    <button class="ws-btn" id="watermarkBtn">💧 Watermark</button>
    <button class="ws-btn" id="rotPageBtn">↻ Rotate 90°</button>
    <button class="ws-btn" id="splitBtn">✂ Split Range</button>
    <button class="ws-btn" id="pagePngBtn">🖼 Page → PNG</button>
    <span class="ws-spacer"></span>
    <button class="ws-btn" id="zoomOutBtn">−</button>
    <span class="mono" id="zoomLbl">115%</span>
    <button class="ws-btn" id="zoomInBtn">+</button>
  </div>

  <div class="pdf-body">
    <aside class="pdf-thumbs" id="thumbRail"></aside>
    <main class="pdf-stage" id="pdfStage">
      <div class="page-holder" id="readerWrap">
        <canvas id="pdfCanvas"></canvas>
        <canvas id="inkOverlay"></canvas>
      </div>
      <div class="organize-grid" id="orgGrid" hidden></div>
    </main>
  </div>

  <div class="ws-status">
    <span id="pdfStatus">Initializing multi-page sample PDF…</span>
    <span id="pageIndicator">Page 1 / 1</span>
  </div>
</div>

<script type="module">
  import { PDFLib, pdfjsLib } from "../../vendor/pdf.bundle.js";
  pdfjsLib.GlobalWorkerOptions.workerSrc = new URL("../../vendor/pdf.worker.min.mjs", window.location.href).href;

  const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;

  let currentPdfBytes = null;
  let pdfJsDoc = null;
  let pageNum = 1;
  let zoom = 1.15;
  let mode = "read";
  let signMode = false;

  async function buildSamplePdf() {
    const doc = await PDFDocument.create();
    const bold = await doc.embedFont(StandardFonts.HelveticaBold);
    const reg = await doc.embedFont(StandardFonts.Helvetica);

    const pagesInfo = [
      ["PDFCRAFT WORKBENCH — EXECUTIVE BRIEF", "Page 1: Read, annotate, sign, watermark, merge, split & reorder pages locally."],
      ["QUARTERLY OPERATIONS SUMMARY", "Page 2: Combine multiple PDFs or JPG/PNG scans directly into this document."],
      ["ARCHITECTURE & SECURITY", "Page 3: 100% browser-native binary PDF processing — zero cloud file uploads."],
      ["SIGN-OFF & APPROVAL SHEET", "Page 4: Click 'Draw Signature' or 'Add Text' above to sign and download this PDF."]
    ];

    pagesInfo.forEach(([title, sub], idx) => {
      const p = doc.addPage([595, 842]);
      p.drawRectangle({ x: 0, y: 742, width: 595, height: 100, color: rgb(0.06, 0.12, 0.16) });
      p.drawText(title, { x: 42, y: 786, size: 17, font: bold, color: rgb(1, 1, 1) });
      p.drawText(sub, { x: 42, y: 760, size: 10.5, font: reg, color: rgb(0.55, 0.9, 0.82) });
      p.drawText(`Document Section 0${idx + 1}`, { x: 42, y: 690, size: 15, font: bold, color: rgb(0.1, 0.15, 0.22) });
      for (let i = 0; i < 6; i++) {
        p.drawRectangle({ x: 42, y: 630 - i * 68, width: 511, height: 50, color: rgb(0.95, 0.97, 0.98) });
        p.drawText(`Item ${idx + 1}.${i + 1} — Verified record ready for review, page rotation, split or signature.`, {
          x: 56, y: 650 - i * 68, size: 11, font: reg, color: rgb(0.2, 0.25, 0.32)
        });
      }
      p.drawLine({ start: { x: 42, y: 120 }, end: { x: 260, y: 120 }, thickness: 1, color: rgb(0.6, 0.65, 0.7) });
      p.drawText("Authorized Signature", { x: 42, y: 102, size: 10, font: reg, color: rgb(0.4, 0.45, 0.5) });
    });
    return await doc.save();
  }

  async function loadBytes(bytes, label = "Document loaded") {
    currentPdfBytes = bytes;
    pdfJsDoc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    pageNum = Math.min(Math.max(1, pageNum), pdfJsDoc.numPages);
    document.getElementById("pdfStatus").textContent = `${label} (${pdfJsDoc.numPages} pages)`;
    await renderThumbnails();
    await renderView();
  }

  async function renderThumbnails() {
    const rail = document.getElementById("thumbRail");
    rail.innerHTML = "";
    for (let i = 1; i <= pdfJsDoc.numPages; i++) {
      const page = await pdfJsDoc.getPage(i);
      const vp = page.getViewport({ scale: 0.27 });
      const card = document.createElement("div");
      card.className = `thumb-card ${i === pageNum ? "active" : ""}`;
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      card.appendChild(cv);
      const cap = document.createElement("div");
      cap.className = "mono";
      cap.style.cssText = "margin-top:4px;font-size:11px;color:#94a3b8";
      cap.textContent = `Page ${i}`;
      card.appendChild(cap);
      card.onclick = () => { mode = "read"; pageNum = i; syncModeButtons(); renderThumbnails(); renderView(); };
      rail.appendChild(card);
    }
  }

  async function renderView() {
    document.getElementById("pageIndicator").textContent = `Page ${pageNum} / ${pdfJsDoc.numPages}`;
    document.getElementById("zoomLbl").textContent = `${Math.round(zoom * 100)}%`;

    if (mode === "read") {
      document.getElementById("readerWrap").hidden = false;
      document.getElementById("orgGrid").hidden = true;
      const page = await pdfJsDoc.getPage(pageNum);
      const vp = page.getViewport({ scale: zoom });
      const cv = document.getElementById("pdfCanvas");
      const ov = document.getElementById("inkOverlay");
      cv.width = ov.width = vp.width;
      cv.height = ov.height = vp.height;
      ov.style.pointerEvents = signMode ? "auto" : "none";
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    } else {
      document.getElementById("readerWrap").hidden = true;
      const grid = document.getElementById("orgGrid");
      grid.hidden = false;
      grid.innerHTML = "";
      for (let i = 1; i <= pdfJsDoc.numPages; i++) {
        const page = await pdfJsDoc.getPage(i);
        const vp = page.getViewport({ scale: 0.34 });
        const item = document.createElement("div");
        item.className = "org-item";
        const cv = document.createElement("canvas");
        cv.width = vp.width; cv.height = vp.height;
        await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
        const bar = document.createElement("div");
        bar.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;justify-content:center";
        bar.innerHTML = `
          <span class="mono" style="width:100%;text-align:center;font-size:11px">Page ${i}</span>
          <button class="ws-btn" data-act="left" data-i="${i - 1}">←</button>
          <button class="ws-btn" data-act="rot" data-i="${i - 1}">↻</button>
          <button class="ws-btn" data-act="del" data-i="${i - 1}">🗑</button>
          <button class="ws-btn" data-act="right" data-i="${i - 1}">→</button>`;
        item.append(cv, bar);
        grid.appendChild(item);
      }
    }
  }

  function syncModeButtons() {
    document.getElementById("modeReadBtn").classList.toggle("active", mode === "read");
    document.getElementById("modeOrgBtn").classList.toggle("active", mode === "org");
  }
  document.getElementById("modeReadBtn").onclick = () => { mode = "read"; syncModeButtons(); renderView(); };
  document.getElementById("modeOrgBtn").onclick = () => { mode = "org"; syncModeButtons(); renderView(); };

  document.getElementById("orgGrid").onclick = async (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const idx = Number(btn.dataset.i);
    const doc = await PDFDocument.load(currentPdfBytes);
    const total = doc.getPageCount();
    if (btn.dataset.act === "rot") {
      const p = doc.getPage(idx);
      p.setRotation(degrees((p.getRotation().angle + 90) % 360));
    } else if (btn.dataset.act === "del" && total > 1) {
      doc.removePage(idx);
    } else if (btn.dataset.act === "left" && idx > 0) {
      const order = Array.from({ length: total }, (_, k) => k);
      [order[idx - 1], order[idx]] = [order[idx], order[idx - 1]];
      const fresh = await PDFDocument.create();
      const copied = await fresh.copyPages(doc, order);
      copied.forEach((p) => fresh.addPage(p));
      return loadBytes(await fresh.save(), `Moved Page ${idx + 1} left`);
    } else if (btn.dataset.act === "right" && idx < total - 1) {
      const order = Array.from({ length: total }, (_, k) => k);
      [order[idx + 1], order[idx]] = [order[idx], order[idx + 1]];
      const fresh = await PDFDocument.create();
      const copied = await fresh.copyPages(doc, order);
      copied.forEach((p) => fresh.addPage(p));
      return loadBytes(await fresh.save(), `Moved Page ${idx + 1} right`);
    }
    await loadBytes(await doc.save(), "Updated page layout");
  };

  // Freehand Ink Signature baked straight into real PDF vector image layer
  const ov = document.getElementById("inkOverlay");
  const octx = ov.getContext("2d");
  let drawing = false;
  ov.addEventListener("pointerdown", (e) => {
    if (!signMode) return;
    drawing = true;
    const r = ov.getBoundingClientRect();
    octx.strokeStyle = "#0b3b8c";
    octx.lineWidth = 3;
    octx.lineCap = "round";
    octx.beginPath();
    octx.moveTo(e.clientX - r.left, e.clientY - r.top);
    ov.setPointerCapture(e.pointerId);
  });
  ov.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const r = ov.getBoundingClientRect();
    octx.lineTo(e.clientX - r.left, e.clientY - r.top);
    octx.stroke();
  });
  ov.addEventListener("pointerup", async () => {
    if (!drawing) return;
    drawing = false;
    const pngBytes = await (await fetch(ov.toDataURL("image/png"))).arrayBuffer();
    const doc = await PDFDocument.load(currentPdfBytes);
    const png = await doc.embedPng(pngBytes);
    const p = doc.getPage(pageNum - 1);
    const { width, height } = p.getSize();
    p.drawImage(png, { x: 0, y: 0, width, height });
    signMode = false;
    document.getElementById("signToggleBtn").classList.remove("active");
    await loadBytes(await doc.save(), `Embedded signature on Page ${pageNum}`);
  });

  document.getElementById("signToggleBtn").onclick = (e) => {
    signMode = !signMode;
    e.currentTarget.classList.toggle("active", signMode);
    ov.style.pointerEvents = signMode ? "auto" : "none";
    document.getElementById("pdfStatus").textContent = signMode
      ? "Draw directly on the page to embed ink signature…"
      : "Signature mode off";
  };

  document.getElementById("addTextStampBtn").onclick = async () => {
    const txt = prompt("Text annotation to stamp onto current page:", "APPROVED & VERIFIED");
    if (!txt) return;
    const doc = await PDFDocument.load(currentPdfBytes);
    const font = await doc.embedFont(StandardFonts.HelveticaBold);
    const p = doc.getPage(pageNum - 1);
    p.drawText(txt, { x: 52, y: 80, size: 15, font, color: rgb(0.07, 0.45, 0.36) });
    await loadBytes(await doc.save(), `Added text note on Page ${pageNum}`);
  };

  document.getElementById("watermarkBtn").onclick = async () => {
    const txt = prompt("Diagonal watermark text for ALL pages:", "CONFIDENTIAL");
    if (!txt) return;
    const doc = await PDFDocument.load(currentPdfBytes);
    const font = await doc.embedFont(StandardFonts.HelveticaBold);
    doc.getPages().forEach((p) => {
      const { width, height } = p.getSize();
      p.drawText(txt, {
        x: width * 0.16, y: height * 0.38, size: 46, font,
        color: rgb(0.75, 0.78, 0.82), opacity: 0.35, rotate: degrees(35)
      });
    });
    await loadBytes(await doc.save(), `Applied '${txt}' watermark across all pages`);
  };

  document.getElementById("rotPageBtn").onclick = async () => {
    const doc = await PDFDocument.load(currentPdfBytes);
    const p = doc.getPage(pageNum - 1);
    p.setRotation(degrees((p.getRotation().angle + 90) % 360));
    await loadBytes(await doc.save(), `Rotated Page ${pageNum} by 90°`);
  };

  document.getElementById("splitBtn").onclick = async () => {
    const spec = prompt(`Enter page range to extract (1-${pdfJsDoc.numPages}), e.g. 1-2:`, `1-${Math.min(2, pdfJsDoc.numPages)}`);
    if (!spec) return;
    const src = await PDFDocument.load(currentPdfBytes);
    const out = await PDFDocument.create();
    const indices = [];
    spec.split(",").forEach((part) => {
      const [a, b] = part.trim().split("-").map(Number);
      const end = b || a;
      for (let k = a; k <= end; k++) if (k >= 1 && k <= src.getPageCount()) indices.push(k - 1);
    });
    if (!indices.length) return;
    (await out.copyPages(src, indices)).forEach((p) => out.addPage(p));
    const bytes = await out.save();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    link.download = `pdfcraft-split-${spec.replace(/\s+/g, "")}.pdf`;
    link.click();
  };

  document.getElementById("pagePngBtn").onclick = () => {
    const cv = document.getElementById("pdfCanvas");
    const a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = `pdfcraft-page-${pageNum}.png`;
    a.click();
  };

  document.getElementById("openPdf").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    pageNum = 1;
    await loadBytes(new Uint8Array(await file.arrayBuffer()), `Opened ${file.name}`);
  };

  document.getElementById("mergeInput").onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const base = await PDFDocument.load(currentPdfBytes);
    for (const f of files) {
      const buf = await f.arrayBuffer();
      if (f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")) {
        const extra = await PDFDocument.load(buf);
        const copied = await base.copyPages(extra, extra.getPageIndices());
        copied.forEach((p) => base.addPage(p));
      } else {
        const img = f.name.toLowerCase().endsWith(".png") ? await base.embedPng(buf) : await base.embedJpg(buf);
        const p = base.addPage([595, 842]);
        const scale = Math.min(535 / img.width, 782 / img.height);
        p.drawImage(img, {
          x: (595 - img.width * scale) / 2,
          y: (842 - img.height * scale) / 2,
          width: img.width * scale,
          height: img.height * scale
        });
      }
    }
    await loadBytes(await base.save(), `Merged ${files.length} file(s)`);
  };

  document.getElementById("downloadPdfBtn").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([currentPdfBytes], { type: "application/pdf" }));
    a.download = "pdfcraft-document.pdf";
    a.click();
  };

  document.getElementById("zoomInBtn").onclick = () => { zoom = Math.min(2.4, zoom + 0.15); renderView(); };
  document.getElementById("zoomOutBtn").onclick = () => { zoom = Math.max(0.55, zoom - 0.15); renderView(); };

  (async () => {
    loadBytes(await buildSamplePdf(), "Sample multi-page PDF ready");
  })();
</script>
</body>
</html>
