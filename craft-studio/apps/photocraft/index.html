<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoCraft — Layered Photo & PSD Studio</title>
  <link rel="icon" href="../../assets/icons/photocraft.png">
  <link rel="stylesheet" href="../../assets/studio-common.css">
  <style>
    :root { --accent: #2f7bf5; }
    .ps-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 46px 1fr 278px; }
    .ps-tools {
      background: #171b24; border-right: 1px solid var(--ui-line);
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; overflow-y: auto;
    }
    .tool-btn {
      width: 34px; height: 32px; border-radius: 7px; border: 1px solid transparent;
      background: transparent; color: #94a3b8; font-size: 14px; cursor: pointer; display: grid; place-items: center;
    }
    .tool-btn:hover { background: #222938; color: #fff; }
    .tool-btn.active { background: #2f7bf5; color: #fff; }
    .ps-stage {
      position: relative; overflow: auto; display: grid; place-items: center; padding: 20px;
      background-color: #101319;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .canvas-wrap {
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.16);
      background-image: linear-gradient(45deg, #2a2e38 25%, transparent 25%), linear-gradient(-45deg, #2a2e38 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a2e38 75%), linear-gradient(-45deg, transparent 75%, #2a2e38 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: #1f222a;
    }
    #viewCanvas { display: block; max-width: 100%; height: auto; cursor: crosshair; touch-action: none; }
    .ps-side {
      background: var(--ui-panel); border-left: 1px solid var(--ui-line);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .panel-sec { padding: 10px 12px; border-bottom: 1px solid var(--ui-line); }
    .panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ui-muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
    .adj-row { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 11.5px; }
    .layer-list { display: flex; flex-direction: column; gap: 5px; max-height: 250px; overflow-y: auto; }
    .layer-item {
      display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 7px;
      background: #131720; border: 1px solid var(--ui-line); cursor: pointer; font-size: 12px;
    }
    .layer-item.active { border-color: #2f7bf5; background: rgba(47, 123, 245, 0.16); }
    @media (max-width: 860px) { .ps-body { grid-template-columns: 42px 1fr; } .ps-side { grid-column: 1 / -1; max-height: 250px; border-left: 0; border-top: 1px solid var(--ui-line); } }
  </style>
</head>
<body>
<div class="ws-app">
  <div class="ws-menubar">
    <span class="ws-logo"><img src="../../assets/icons/photocraft.png" alt=""> PhotoCraft <small style="opacity:.6">PSD</small></span>
    <label class="ws-btn">📂 Open Image / .PSD <input id="openInput" type="file" accept=".psd,image/*" hidden></label>
    <label class="ws-btn">🖼 + Place Layer <input id="placeInput" type="file" accept="image/*" hidden></label>
    <button class="ws-btn primary" id="savePsdBtn">💾 Save Layered .PSD</button>
    <button class="ws-btn" id="savePngBtn">⬇ PNG</button>
    <button class="ws-btn" id="saveJpgBtn">⬇ JPG</button>
    <button class="ws-btn" id="saveWebpBtn">⬇ WebP</button>
    <span class="ws-sep"></span>
    <button class="ws-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
    <label style="display:inline-flex;align-items:center;gap:4px">Color <input type="color" id="fgSwatch" value="#38bdf8"></label>
    <label style="display:inline-flex;align-items:center;gap:5px">Size <input type="range" id="sizeRange" min="2" max="90" value="18" style="width:74px"></label>
    <button class="ws-btn" id="addTextBtn">𝐓 + Text Layer</button>
    <button class="ws-btn" id="flipHBtn">⇆ Flip</button>
    <button class="ws-btn" id="rot90Btn">↻ 90°</button>
  </div>

  <div class="ps-body">
    <!-- Left Photoshop Tool Rail -->
    <div class="ps-tools" id="toolRail">
      <button class="tool-btn active" data-tool="move" title="Move Layer (V)">✥</button>
      <button class="tool-btn" data-tool="brush" title="Brush Paint (B)">🖌</button>
      <button class="tool-btn" data-tool="eraser" title="Eraser (E)">⌫</button>
      <button class="tool-btn" data-tool="rect" title="Rectangle Shape (U)">▭</button>
      <button class="tool-btn" data-tool="ellipse" title="Ellipse Shape (O)">◯</button>
      <button class="tool-btn" data-tool="line" title="Line Tool (L)">╱</button>
      <button class="tool-btn" data-tool="fill" title="Fill Layer (G)">🪣</button>
      <button class="tool-btn" data-tool="picker" title="Eyedropper Color Picker (I)">💉</button>
    </div>

    <!-- Center Composited Canvas -->
    <div class="ps-stage">
      <div class="canvas-wrap">
        <canvas id="viewCanvas" width="960" height="600"></canvas>
      </div>
    </div>

    <!-- Right Inspector: Live RGB Histogram + Adjustments + Layers -->
    <aside class="ps-side">
      <div class="panel-sec">
        <div class="panel-title"><span>Live RGB Histogram</span><span class="mono" id="dimLabel">960×600</span></div>
        <canvas id="histCanvas" width="248" height="68" style="width:100%;background:#0e1118;border-radius:6px;border:1px solid var(--ui-line)"></canvas>
      </div>

      <div class="panel-sec">
        <div class="panel-title">
          <span>Layer Adjustments</span>
          <button class="ws-btn" id="resetAdjBtn" style="height:21px;font-size:10.5px;padding:0 6px">Reset</button>
        </div>
        <div class="adj-row"><span>Brightness</span><input type="range" id="adjBright" min="30" max="200" value="100"><span class="mono" id="valBright">100</span></div>
        <div class="adj-row"><span>Contrast</span><input type="range" id="adjContrast" min="30" max="220" value="100"><span class="mono" id="valContrast">100</span></div>
        <div class="adj-row"><span>Saturate</span><input type="range" id="adjSat" min="0" max="250" value="100"><span class="mono" id="valSat">100</span></div>
        <div class="adj-row"><span>Hue Shift</span><input type="range" id="adjHue" min="-180" max="180" value="0"><span class="mono" id="valHue">0°</span></div>
        <div class="adj-row"><span>Blur (px)</span><input type="range" id="adjBlur" min="0" max="20" value="0"><span class="mono" id="valBlur">0</span></div>
        <div class="adj-row"><span>Shadow</span><input type="range" id="adjShadow" min="0" max="40" value="0"><span class="mono" id="valShadow">0</span></div>
      </div>

      <div class="panel-sec" style="flex:1">
        <div class="panel-title">
          <span>Layers Stack</span>
          <span style="display:flex;gap:4px">
            <button class="ws-btn" id="newLayerBtn" style="height:22px;padding:0 7px" title="New Empty Paint Layer">+ Layer</button>
            <button class="ws-btn" id="dupLayerBtn" style="height:22px;padding:0 7px" title="Duplicate Layer">⧉</button>
            <button class="ws-btn" id="delLayerBtn" style="height:22px;padding:0 7px" title="Delete Layer">🗑</button>
          </span>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
          <select id="blendSelect" class="ws-select" style="flex:1">
            <option value="source-over">Normal</option>
            <option value="multiply">Multiply</option>
            <option value="screen">Screen</option>
            <option value="overlay">Overlay</option>
            <option value="darken">Darken</option>
            <option value="lighten">Lighten</option>
            <option value="color-dodge">Color Dodge</option>
            <option value="difference">Difference</option>
          </select>
          <input type="range" id="opacityRange" min="0" max="100" value="100" style="width:82px" title="Layer Opacity">
        </div>
        <div class="layer-list" id="layerList"></div>
      </div>
    </aside>
  </div>

  <div class="ws-status">
    <span id="statusMsg">PhotoCraft Ready — Real multi-layer .PSD read/write enabled</span>
    <span id="cursorPos">X: 0, Y: 0</span>
  </div>
</div>

<script type="module">
  import { readPsd, writePsd } from "../../vendor/psd.bundle.js";

  const view = document.getElementById("viewCanvas");
  const vctx = view.getContext("2d", { willReadFrequently: true });
  let docW = 960, docH = 600;
  let layers = [];
  let activeIdx = 0;
  let tool = "move";
  let undoStack = [];

  function makeLayer(name, w = docW, h = docH) {
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    return {
      id: crypto.randomUUID(),
      name,
      canvas: cv,
      x: 0,
      y: 0,
      visible: true,
      opacity: 100,
      blend: "source-over",
      adj: { bright: 100, contrast: 100, sat: 100, hue: 0, blur: 0, shadow: 0 }
    };
  }

  function pushUndo() {
    undoStack.push(layers.map((l) => ({
      ...l,
      adj: { ...l.adj },
      dataUrl: l.canvas.toDataURL("image/png")
    })));
    if (undoStack.length > 15) undoStack.shift();
  }

  async function initDemoComposition() {
    const bg = makeLayer("Background Artwork");
    const img = new Image();
    img.src = "../../assets/screenshots/photocraft/adjustments.jpg";
    await new Promise((r) => { img.onload = r; img.onerror = r; });
    const bctx = bg.canvas.getContext("2d");
    if (img.naturalWidth) bctx.drawImage(img, 0, 0, docW, docH);
    else {
      const g = bctx.createLinearGradient(0, 0, docW, docH);
      g.addColorStop(0, "#0f172a"); g.addColorStop(1, "#1d4ed8");
      bctx.fillStyle = g; bctx.fillRect(0, 0, docW, docH);
    }

    const glow = makeLayer("Color Atmosphere");
    glow.blend = "screen";
    glow.opacity = 55;
    const gctx = glow.canvas.getContext("2d");
    const rad = gctx.createRadialGradient(260, 170, 20, 260, 170, 420);
    rad.addColorStop(0, "rgba(56,189,248,0.85)");
    rad.addColorStop(1, "rgba(15,23,42,0)");
    gctx.fillStyle = rad;
    gctx.fillRect(0, 0, docW, docH);

    const card = makeLayer("Caption Badge & Type");
    card.adj.shadow = 18;
    const tctx = card.canvas.getContext("2d");
    tctx.fillStyle = "rgba(12, 16, 26, 0.84)";
    tctx.beginPath(); tctx.roundRect(48, 430, 510, 118, 16); tctx.fill();
    tctx.strokeStyle = "rgba(96, 165, 250, 0.6)"; tctx.lineWidth = 2; tctx.stroke();
    tctx.fillStyle = "#f8fafc"; tctx.font = "800 34px sans-serif";
    tctx.fillText("PHOTOCRAFT STUDIO", 76, 484);
    tctx.fillStyle = "#93c5fd"; tctx.font = "600 16px sans-serif";
    tctx.fillText("Drag layers, paint, adjust Curves/HSL, or save real .PSD", 76, 518);

    layers = [bg, glow, card];
    activeIdx = 2;
    syncInspector();
    renderComposite();
  }

  function renderComposite(overlayFn = null) {
    view.width = docW; view.height = docH;
    vctx.clearRect(0, 0, docW, docH);
    for (const l of layers) {
      if (!l.visible) continue;
      vctx.save();
      vctx.globalAlpha = l.opacity / 100;
      vctx.globalCompositeOperation = l.blend;
      const a = l.adj;
      vctx.filter = `brightness(${a.bright}%) contrast(${a.contrast}%) saturate(${a.sat}%) hue-rotate(${a.hue}deg) blur(${a.blur}px)`;
      if (a.shadow > 0) {
        vctx.shadowColor = "rgba(0,0,0,0.72)";
        vctx.shadowBlur = a.shadow;
        vctx.shadowOffsetY = Math.round(a.shadow * 0.35);
      }
      vctx.drawImage(l.canvas, l.x, l.y);
      vctx.restore();
    }
    if (overlayFn) overlayFn(vctx);
    document.getElementById("dimLabel").textContent = `${docW}×${docH}`;
    renderLayerList();
    updateHistogram();
  }

  function updateHistogram() {
    const hc = document.getElementById("histCanvas");
    const hctx = hc.getContext("2d");
    hctx.clearRect(0, 0, hc.width, hc.height);
    const data = vctx.getImageData(0, 0, docW, docH).data;
    const rB = new Uint32Array(64), gB = new Uint32Array(64), bB = new Uint32Array(64);
    for (let i = 0; i < data.length; i += 16) {
      rB[data[i] >> 2]++; gB[data[i + 1] >> 2]++; bB[data[i + 2] >> 2]++;
    }
    const maxV = Math.max(...rB, ...gB, ...bB, 1);
    const plot = (bins, color) => {
      hctx.fillStyle = color;
      for (let x = 0; x < 64; x++) {
        const h = (bins[x] / maxV) * (hc.height - 6);
        hctx.fillRect(x * (hc.width / 64), hc.height - h, hc.width / 64 - 0.5, h);
      }
    };
    hctx.globalCompositeOperation = "screen";
    plot(rB, "rgba(239,68,68,0.75)");
    plot(gB, "rgba(34,197,94,0.75)");
    plot(bB, "rgba(59,130,246,0.85)");
  }

  function renderLayerList() {
    const wrap = document.getElementById("layerList");
    wrap.innerHTML = [...layers].reverse().map((l, revI) => {
      const idx = layers.length - 1 - revI;
      return `<div class="layer-item ${idx === activeIdx ? "active" : ""}" data-idx="${idx}">
        <button class="ws-btn" data-vis="${idx}" style="height:22px;padding:0 5px">${l.visible ? "👁" : "—"}</button>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.name}</span>
        <span class="mono" style="font-size:10.5px;color:#94a3b8">${l.opacity}%</span>
      </div>`;
    }).join("");
  }

  function syncInspector() {
    const l = layers[activeIdx];
    if (!l) return;
    document.getElementById("blendSelect").value = l.blend;
    document.getElementById("opacityRange").value = l.opacity;
    const map = [["Bright","bright",""],["Contrast","contrast",""],["Sat","sat",""],["Hue","hue","°"],["Blur","blur",""],["Shadow","shadow",""]];
    for (const [ui, k, suf] of map) {
      document.getElementById("adj" + ui).value = l.adj[k];
      document.getElementById("val" + ui).textContent = l.adj[k] + suf;
    }
  }

  // Pointer Canvas Interactions
  let down = false, sx = 0, sy = 0, origX = 0, origY = 0;
  function canvasCoords(e) {
    const rect = view.getBoundingClientRect();
    return {
      x: Math.round(((e.clientX - rect.left) / rect.width) * docW),
      y: Math.round(((e.clientY - rect.top) / rect.height) * docH)
    };
  }

  view.addEventListener("pointerdown", (e) => {
    const l = layers[activeIdx];
    if (!l) return;
    const { x, y } = canvasCoords(e);
    if (tool === "picker") {
      const px = vctx.getImageData(x, y, 1, 1).data;
      document.getElementById("fgSwatch").value =
        "#" + [px[0], px[1], px[2]].map((v) => v.toString(16).padStart(2, "0")).join("");
      return;
    }
    pushUndo();
    if (tool === "fill") {
      const ctx = l.canvas.getContext("2d");
      ctx.fillStyle = document.getElementById("fgSwatch").value;
      ctx.fillRect(0, 0, l.canvas.width, l.canvas.height);
      renderComposite();
      return;
    }
    down = true; sx = x; sy = y; origX = l.x; origY = l.y;
    view.setPointerCapture(e.pointerId);
  });

  view.addEventListener("pointermove", (e) => {
    const { x, y } = canvasCoords(e);
    document.getElementById("cursorPos").textContent = `X: ${x}, Y: ${y}`;
    if (!down) return;
    const l = layers[activeIdx];
    const ctx = l.canvas.getContext("2d");
    const sz = Number(document.getElementById("sizeRange").value);
    const col = document.getElementById("fgSwatch").value;

    if (tool === "move") {
      l.x = origX + (x - sx);
      l.y = origY + (y - sy);
      renderComposite();
    } else if (tool === "brush" || tool === "eraser") {
      ctx.save();
      ctx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
      ctx.strokeStyle = col;
      ctx.lineWidth = sz;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(sx - l.x, sy - l.y);
      ctx.lineTo(x - l.x, y - l.y);
      ctx.stroke();
      ctx.restore();
      sx = x; sy = y;
      renderComposite();
    } else if (tool === "rect" || tool === "ellipse" || tool === "line") {
      renderComposite((ov) => {
        ov.strokeStyle = col; ov.fillStyle = col + "55"; ov.lineWidth = Math.max(2, sz / 4);
        if (tool === "rect") {
          ov.fillRect(sx, sy, x - sx, y - sy);
          ov.strokeRect(sx, sy, x - sx, y - sy);
        } else if (tool === "ellipse") {
          ov.beginPath();
          ov.ellipse((sx + x) / 2, (sy + y) / 2, Math.abs(x - sx) / 2, Math.abs(y - sy) / 2, 0, 0, Math.PI * 2);
          ov.fill(); ov.stroke();
        } else {
          ov.beginPath(); ov.moveTo(sx, sy); ov.lineTo(x, y); ov.stroke();
        }
      });
    }
  });

  view.addEventListener("pointerup", (e) => {
    if (!down) return;
    down = false;
    const { x, y } = canvasCoords(e);
    const l = layers[activeIdx];
    const ctx = l.canvas.getContext("2d");
    const sz = Number(document.getElementById("sizeRange").value);
    const col = document.getElementById("fgSwatch").value;
    if (tool === "rect") {
      ctx.fillStyle = col;
      ctx.fillRect(sx - l.x, sy - l.y, x - sx, y - sy);
    } else if (tool === "ellipse") {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse((sx + x) / 2 - l.x, (sy + y) / 2 - l.y, Math.abs(x - sx) / 2, Math.abs(y - sy) / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (tool === "line") {
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, sz / 3); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(sx - l.x, sy - l.y); ctx.lineTo(x - l.x, y - l.y); ctx.stroke();
    }
    renderComposite();
  });

  // UI Controls
  document.getElementById("toolRail").onclick = (e) => {
    const b = e.target.closest("[data-tool]");
    if (!b) return;
    tool = b.dataset.tool;
    document.querySelectorAll(".tool-btn").forEach((el) => el.classList.toggle("active", el === b));
  };

  document.getElementById("layerList").onclick = (e) => {
    const vis = e.target.closest("[data-vis]");
    if (vis) {
      e.stopPropagation();
      const idx = Number(vis.dataset.vis);
      layers[idx].visible = !layers[idx].visible;
      renderComposite();
      return;
    }
    const item = e.target.closest("[data-idx]");
    if (item) { activeIdx = Number(item.dataset.idx); syncInspector(); renderLayerList(); }
  };

  for (const [ui, k] of [["Bright","bright"],["Contrast","contrast"],["Sat","sat"],["Hue","hue"],["Blur","blur"],["Shadow","shadow"]]) {
    document.getElementById("adj" + ui).oninput = (e) => {
      if (!layers[activeIdx]) return;
      layers[activeIdx].adj[k] = Number(e.target.value);
      syncInspector();
      renderComposite();
    };
  }
  document.getElementById("resetAdjBtn").onclick = () => {
    if (!layers[activeIdx]) return;
    layers[activeIdx].adj = { bright: 100, contrast: 100, sat: 100, hue: 0, blur: 0, shadow: 0 };
    syncInspector(); renderComposite();
  };
  document.getElementById("blendSelect").onchange = (e) => { layers[activeIdx].blend = e.target.value; renderComposite(); };
  document.getElementById("opacityRange").oninput = (e) => { layers[activeIdx].opacity = Number(e.target.value); renderComposite(); };

  document.getElementById("newLayerBtn").onclick = () => {
    layers.push(makeLayer(`Paint Layer ${layers.length + 1}`));
    activeIdx = layers.length - 1;
    syncInspector(); renderComposite();
  };
  document.getElementById("dupLayerBtn").onclick = () => {
    const src = layers[activeIdx];
    if (!src) return;
    const copy = makeLayer(`${src.name} Copy`);
    copy.canvas.getContext("2d").drawImage(src.canvas, 0, 0);
    copy.x = src.x + 20; copy.y = src.y + 20; copy.opacity = src.opacity; copy.blend = src.blend;
    copy.adj = { ...src.adj };
    layers.splice(activeIdx + 1, 0, copy);
    activeIdx++;
    syncInspector(); renderComposite();
  };
  document.getElementById("delLayerBtn").onclick = () => {
    if (layers.length <= 1) return;
    layers.splice(activeIdx, 1);
    activeIdx = Math.max(0, activeIdx - 1);
    syncInspector(); renderComposite();
  };

  document.getElementById("addTextBtn").onclick = () => {
    const txt = prompt("Enter Text Layer content:", "New Studio Headline");
    if (!txt) return;
    const l = makeLayer(`Type: ${txt.slice(0, 14)}`);
    const ctx = l.canvas.getContext("2d");
    ctx.fillStyle = document.getElementById("fgSwatch").value;
    ctx.font = "800 44px sans-serif";
    ctx.fillText(txt, 90, 160);
    l.adj.shadow = 12;
    layers.push(l);
    activeIdx = layers.length - 1;
    tool = "move";
    syncInspector(); renderComposite();
  };

  document.getElementById("flipHBtn").onclick = () => {
    const l = layers[activeIdx];
    const tmp = document.createElement("canvas"); tmp.width = l.canvas.width; tmp.height = l.canvas.height;
    const t = tmp.getContext("2d"); t.translate(tmp.width, 0); t.scale(-1, 1); t.drawImage(l.canvas, 0, 0);
    l.canvas = tmp; renderComposite();
  };

  document.getElementById("rot90Btn").onclick = () => {
    [docW, docH] = [docH, docW];
    layers.forEach((l) => {
      const tmp = document.createElement("canvas"); tmp.width = docW; tmp.height = docH;
      const t = tmp.getContext("2d"); t.translate(docW / 2, docH / 2); t.rotate(Math.PI / 2);
      t.drawImage(l.canvas, -l.canvas.width / 2, -l.canvas.height / 2);
      l.canvas = tmp;
    });
    renderComposite();
  };

  document.getElementById("undoBtn").onclick = async () => {
    const snap = undoStack.pop();
    if (!snap) return;
    layers = await Promise.all(snap.map(async (s) => {
      const l = makeLayer(s.name);
      Object.assign(l, { x: s.x, y: s.y, visible: s.visible, opacity: s.opacity, blend: s.blend, adj: s.adj });
      const im = new Image(); im.src = s.dataUrl;
      await new Promise((r) => { im.onload = r; });
      l.canvas.getContext("2d").drawImage(im, 0, 0);
      return l;
    }));
    activeIdx = Math.min(activeIdx, layers.length - 1);
    syncInspector(); renderComposite();
  };

  // Real .PSD & Raster Open / Export
  document.getElementById("openInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.name.toLowerCase().endswith?.(".psd") || file.name.toLowerCase().endsWith(".psd")) {
      const buf = await file.arrayBuffer();
      const psd = readPsd(buf);
      docW = psd.width; docH = psd.height;
      const loaded = (psd.children || []).filter((c) => c.canvas).map((c) => {
        const l = makeLayer(c.name || "PSD Layer", docW, docH);
        l.canvas.getContext("2d").drawImage(c.canvas, c.left || 0, c.top || 0);
        l.opacity = Math.round(((c.opacity ?? 255) / 255) * 100);
        l.visible = !c.hidden;
        return l;
      });
      if (!loaded.length && psd.canvas) {
        const l = makeLayer("PSD Composite", docW, docH);
        l.canvas.getContext("2d").drawImage(psd.canvas, 0, 0);
        loaded.push(l);
      }
      layers = loaded;
      activeIdx = layers.length - 1;
      document.getElementById("statusMsg").textContent = `Opened layered PSD: ${file.name} (${layers.length} layers)`;
      syncInspector(); renderComposite();
    } else {
      const im = new Image();
      im.src = URL.createObjectURL(file);
      await new Promise((r) => { im.onload = r; });
      docW = Math.min(1600, im.naturalWidth);
      docH = Math.round((docW / im.naturalWidth) * im.naturalHeight);
      const l = makeLayer(file.name, docW, docH);
      l.canvas.getContext("2d").drawImage(im, 0, 0, docW, docH);
      layers = [l]; activeIdx = 0;
      document.getElementById("statusMsg").textContent = `Opened ${file.name} (${docW}×${docH})`;
      syncInspector(); renderComposite();
    }
  };

  document.getElementById("placeInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const im = new Image();
    im.src = URL.createObjectURL(file);
    await new Promise((r) => { im.onload = r; });
    const l = makeLayer(file.name);
    const scale = Math.min((docW * 0.7) / im.naturalWidth, (docH * 0.7) / im.naturalHeight, 1);
    l.canvas.getContext("2d").drawImage(im, 60, 60, im.naturalWidth * scale, im.naturalHeight * scale);
    layers.push(l); activeIdx = layers.length - 1;
    renderComposite();
  };

  document.getElementById("savePsdBtn").onclick = () => {
    renderComposite();
    const psd = {
      width: docW,
      height: docH,
      canvas: view,
      children: layers.map((l) => ({
        name: l.name,
        left: l.x,
        top: l.y,
        opacity: Math.round((l.opacity / 100) * 255),
        hidden: !l.visible,
        canvas: l.canvas
      }))
    };
    const buffer = writePsd(psd);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buffer], { type: "application/octet-stream" }));
    a.download = "photocraft-project.psd";
    a.click();
    document.getElementById("statusMsg").textContent = `Exported real multi-layer PSD (${layers.length} layers)`;
  };

  function exportFlat(mime, ext) {
    renderComposite();
    view.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `photocraft-export.${ext}`;
      a.click();
    }, mime, 0.92);
  }
  document.getElementById("savePngBtn").onclick = () => exportFlat("image/png", "png");
  document.getElementById("saveJpgBtn").onclick = () => exportFlat("image/jpeg", "jpg");
  document.getElementById("saveWebpBtn").onclick = () => exportFlat("image/webp", "webp");

  initDemoComposition();
</script>
</body>
</html>
