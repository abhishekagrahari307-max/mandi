name: Multi-Daily Mandi Price Update

on:
  schedule:
    - cron: '0 1,7,11,15 * * *'
  workflow_dispatch:

concurrency:
  group: mandi-official-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-prices:
    name: Refresh and publish official snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh official price feeds
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          DATA_GOV_RESOURCE_ID: ${{ secrets.DATA_GOV_RESOURCE_ID || '9ef84268-d588-465a-a308-a864a43d0070' }}
          ENAM_TRADE_FEED_URL: ${{ secrets.ENAM_TRADE_FEED_URL }}
          ENAM_TRADE_API_KEY: ${{ secrets.ENAM_TRADE_API_KEY }}
          UP_EMANDI_TRADE_FEED_URL: ${{ secrets.UP_EMANDI_TRADE_FEED_URL }}
          UP_EMANDI_TRADE_API_KEY: ${{ secrets.UP_EMANDI_TRADE_API_KEY }}
          ENAM_AUCTION_FEED_URL: ${{ secrets.ENAM_AUCTION_FEED_URL }}
          ENAM_AUCTION_API_KEY: ${{ secrets.ENAM_AUCTION_API_KEY }}
        run: python update_data.py

      - name: Build and verify browser snapshot
        run: python scripts/build_dashboard_snapshot.py

      - name: Publish snapshots
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/source_prices.json data/history.json data/state_prices.json data/mandis.json data/auction.json data/benchmarks.json data/basti_division.json data/sources.json data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official mandi snapshots'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
