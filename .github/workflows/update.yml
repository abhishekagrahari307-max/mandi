name: Multi-Daily Mandi Price Update

on:
  schedule:
    # Runs 4 times a day to capture all government update cycles:
    # 1. 01:00 UTC -> 06:30 AM IST (Morning arrival rates)
    # 2. 07:00 UTC -> 12:30 PM IST (Midday updates)
    # 3. 11:00 UTC -> 04:30 PM IST (Afternoon rates consolidation)
    # 4. 15:00 UTC -> 08:30 PM IST (Final evening updates)
    - cron: '0 1,7,11,15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run data update script
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Vijay Kumar Traders"
          git config --global user.email "trader@example.com"
          git add data/latest.json data/history.json data/weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌾 Auto-updated Live Mandi Rates" && git push)
