name: Daily Mandi Price Update

on:
  schedule:
    # Runs at 00:30 UTC every day (6:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any packages if needed, e.g. requests, beautifulsoup4
          # pip install requests beautifulsoup4

      - name: Run data update script
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Vijay Kumar Traders"
          git config --global user.email "trader@example.com"
          git add data/latest.json data/history.json data/weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌾 Auto-updated Daily Mandi Rates (6:00 AM IST)" && git push)
