services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/runtime/mandi_v2.db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate it with openssl rand -hex 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
    volumes:
      - mandi_runtime:/app/runtime
    restart: unless-stopped

volumes:
  mandi_runtime:
