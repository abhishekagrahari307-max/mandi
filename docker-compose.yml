services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/runtime/mandi_v2.db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (generate it with openssl rand -hex 32)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,https://abhishekagrahari307-max.github.io}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      DATA_GOV_RESOURCE_ID: ${DATA_GOV_RESOURCE_ID:-9ef84268-d588-465a-a308-a864a43d0070}
      ENAM_TRADE_FEED_URL: ${ENAM_TRADE_FEED_URL:-}
      ENAM_TRADE_API_KEY: ${ENAM_TRADE_API_KEY:-}
      UP_EMANDI_TRADE_FEED_URL: ${UP_EMANDI_TRADE_FEED_URL:-}
      UP_EMANDI_TRADE_API_KEY: ${UP_EMANDI_TRADE_API_KEY:-}
      ENAM_AUCTION_FEED_URL: ${ENAM_AUCTION_FEED_URL:-}
      ENAM_AUCTION_API_KEY: ${ENAM_AUCTION_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-r1:free}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-google/gemini-2.0-flash-exp:free}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://abhishekagrahari307-max.github.io/mandi/}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-UP Mandi Dashboard}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-45}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-700}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
    volumes:
      - mandi_runtime:/app/runtime
    restart: unless-stopped

volumes:
  mandi_runtime:
